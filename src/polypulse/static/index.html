<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyPulse Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        header { padding: 12px 20px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.2rem; color: #a78bfa; }
        header .status { font-size: 0.85rem; color: #94a3b8; }
        #search-bar { padding: 8px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; gap: 8px; }
        #search-bar input { flex: 1; padding: 6px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.9rem; }
        #search-bar button { padding: 6px 16px; border-radius: 6px; border: none; background: #7c3aed; color: white; cursor: pointer; font-size: 0.9rem; }
        #search-bar button:hover { background: #6d28d9; }
        #treemap { flex: 1; position: relative; overflow: hidden; }
        .tile { position: absolute; overflow: hidden; border: 1px solid #1e293b; cursor: pointer; display: flex; flex-direction: column; justify-content: center; padding: 8px 12px; transition: opacity 0.2s; }
        .tile:hover { opacity: 0.85; }
        .tile .question { font-size: 0.85rem; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .tile .stats { font-size: 0.75rem; margin-top: 4px; opacity: 0.9; }
        .tile .signal { font-size: 0.7rem; font-weight: 700; margin-top: 2px; }
        .tile.small .question { -webkit-line-clamp: 1; font-size: 0.75rem; }
        .tile.small .stats { font-size: 0.65rem; }
        #detail { display: none; position: fixed; top: 0; right: 0; width: 360px; height: 100vh; background: #1e293b; border-left: 1px solid #334155; padding: 20px; overflow-y: auto; z-index: 10; }
        #detail.open { display: block; }
        #detail .close { float: right; cursor: pointer; font-size: 1.2rem; color: #94a3b8; background: none; border: none; }
        #detail h2 { font-size: 1rem; color: #a78bfa; margin-bottom: 12px; padding-right: 24px; }
        #detail .field { margin-bottom: 10px; }
        #detail .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
        #detail .value { font-size: 0.95rem; }
        #detail .vibe { margin-top: 16px; padding: 12px; background: #0f172a; border-radius: 8px; }
        #detail .vibe .loading { color: #94a3b8; font-style: italic; }
        .main { display: flex; flex-direction: column; height: 100vh; }
        #search-results { display: none; padding: 16px; overflow-y: auto; flex: 1; }
        #search-results.open { display: block; }
        #search-results table { width: 100%; border-collapse: collapse; }
        #search-results th { text-align: left; padding: 8px; color: #94a3b8; border-bottom: 1px solid #334155; font-size: 0.8rem; }
        #search-results td { padding: 8px; border-bottom: 1px solid #1e293b; font-size: 0.85rem; }
        #search-results .back { cursor: pointer; color: #a78bfa; margin-bottom: 12px; display: inline-block; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="main">
        <header>
            <h1>📊 PolyPulse</h1>
            <div class="status" id="status">Loading...</div>
        </header>
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="Search markets..." />
            <button onclick="doSearch()">Search</button>
        </div>
        <div id="treemap"></div>
        <div id="search-results"></div>
    </div>

    <div id="detail">
        <button class="close" onclick="closeDetail()">✕</button>
        <div id="detail-content"></div>
    </div>

    <script>
    let marketsData = [];
    let refreshTimer = null;

    // --- Color mapping by price change ---
    function tileColor(market) {
        if (market.signal === 'OTHER') return '#3b82f6';
        const change = market.one_day_change || 0;
        if (change > 0.05) return '#22c55e';
        if (change > 0.01) return '#16a34a';
        if (change > -0.01) return '#ca8a04';
        if (change > -0.05) return '#dc2626';
        return '#ef4444';
    }

    // --- Treemap layout (squarified) ---
    function layoutTreemap(values, bounds) {
        if (!values.length || bounds.w <= 0 || bounds.h <= 0) return values.map(() => ({x:0,y:0,w:0,h:0}));
        const total = values.reduce((s, v) => s + v.value, 0) || 1;
        const indexed = values.map((v, i) => ({...v, _i: i})).sort((a, b) => b.value - a.value);
        const rects = squarify(indexed, total, bounds);
        const result = new Array(values.length);
        rects.forEach(r => { result[r._i] = r; });
        return result;
    }

    function squarify(items, total, bounds) {
        if (!items.length) return [];
        if (items.length === 1) return [{...items[0], x: bounds.x, y: bounds.y, w: bounds.w, h: bounds.h}];
        if (bounds.w <= 0 || bounds.h <= 0) return items.map(it => ({...it, x: bounds.x, y: bounds.y, w: 0, h: 0}));

        let bestSplit = 1, bestWorst = Infinity;
        for (let split = 1; split <= items.length; split++) {
            const row = items.slice(0, split);
            const rowSum = row.reduce((s, r) => s + r.value, 0);
            const frac = rowSum / total;
            const isWide = bounds.w >= bounds.h;
            const stripW = isWide ? Math.max(1, Math.round(bounds.w * frac)) : bounds.w;
            const stripH = isWide ? bounds.h : Math.max(1, Math.round(bounds.h * frac));
            let worst = 0;
            for (const v of row) {
                const itemFrac = v.value / rowSum;
                const iw = isWide ? stripW : Math.max(1, Math.round(stripW * itemFrac));
                const ih = isWide ? Math.max(1, Math.round(stripH * itemFrac)) : stripH;
                const aspect = Math.max(iw / ih, ih / iw);
                worst = Math.max(worst, aspect);
            }
            if (worst <= bestWorst) { bestWorst = worst; bestSplit = split; } else break;
        }

        const row = items.slice(0, bestSplit);
        const rest = items.slice(bestSplit);
        const rowSum = row.reduce((s, r) => s + r.value, 0);
        const frac = rowSum / total;
        const isWide = bounds.w >= bounds.h;
        const rects = [];

        if (isWide) {
            const stripW = Math.max(1, Math.round(bounds.w * frac));
            let cy = bounds.y;
            row.forEach((v, i) => {
                const itemFrac = v.value / rowSum;
                const ih = (i === row.length - 1) ? (bounds.y + bounds.h - cy) : Math.max(1, Math.round(bounds.h * itemFrac));
                rects.push({...v, x: bounds.x, y: cy, w: stripW, h: ih});
                cy += ih;
            });
            if (rest.length) rects.push(...squarify(rest, total - rowSum, {x: bounds.x + stripW, y: bounds.y, w: bounds.w - stripW, h: bounds.h}));
        } else {
            const stripH = Math.max(1, Math.round(bounds.h * frac));
            let cx = bounds.x;
            row.forEach((v, i) => {
                const itemFrac = v.value / rowSum;
                const iw = (i === row.length - 1) ? (bounds.x + bounds.w - cx) : Math.max(1, Math.round(bounds.w * itemFrac));
                rects.push({...v, x: cx, y: bounds.y, w: iw, h: stripH});
                cx += iw;
            });
            if (rest.length) rects.push(...squarify(rest, total - rowSum, {x: bounds.x, y: bounds.y + stripH, w: bounds.w, h: bounds.h - stripH}));
        }
        return rects;
    }

    // --- Scaling: use pre-computed scaled_volume from backend ---

    // --- Format helpers ---
    function fmtVol(v) {
        if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
        if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
        return '$' + v.toFixed(0);
    }

    // --- Render treemap ---
    function renderTreemap(markets) {
        const container = document.getElementById('treemap');
        const searchResults = document.getElementById('search-results');
        searchResults.classList.remove('open');
        container.style.display = 'block';
        container.innerHTML = '';
        const rect = container.getBoundingClientRect();
        const W = rect.width, H = rect.height;
        if (!markets.length || W === 0 || H === 0) return;

        const items = markets.map((m, i) => ({...m, value: m.scaled_volume || m.volume_24h || 0.001}));
        const layout = layoutTreemap(items, {x: 0, y: 0, w: W, h: H});

        markets.forEach((m, i) => {
            const r = layout[i];
            if (!r || r.w < 2 || r.h < 2) return;
            const div = document.createElement('div');
            div.className = 'tile' + (r.w < 150 || r.h < 60 ? ' small' : '');
            div.style.left = r.x + 'px';
            div.style.top = r.y + 'px';
            div.style.width = r.w + 'px';
            div.style.height = r.h + 'px';
            div.style.background = tileColor(m);

            const q = m.question || m.slug;
            const change = m.one_day_change || 0;
            const changeStr = (change >= 0 ? '+' : '') + (change * 100).toFixed(1) + '%';
            div.innerHTML = `
                <div class="question">${q}</div>
                <div class="stats">${m.price != null ? m.price.toFixed(3) : ''} · ${fmtVol(m.volume_24h || 0)} · ${changeStr}</div>
            `;
            if (m.slug !== '_others') div.onclick = () => showDetail(m);
            container.appendChild(div);
        });
    }

    // --- Detail panel ---
    function showDetail(market) {
        const panel = document.getElementById('detail');
        const content = document.getElementById('detail-content');
        panel.classList.add('open');
        content.innerHTML = `
            <h2>${market.question || market.slug}</h2>
            <div class="field"><div class="label">Slug</div><div class="value">${market.slug}</div></div>
            <div class="field"><div class="label">Price</div><div class="value">${market.price != null ? market.price.toFixed(3) : '?'}</div></div>
            <div class="field"><div class="label">24h Volume</div><div class="value">${fmtVol(market.volume_24h || 0)}</div></div>
            <div class="field"><div class="label">Signal</div><div class="value">${market.signal}</div></div>
            <div class="vibe"><div class="loading">Loading vibe check...</div></div>
        `;
        fetch('/api/vibe/' + encodeURIComponent(market.slug))
            .then(r => r.json())
            .then(data => {
                const emoji = {bullish: '🟢', bearish: '🔴', neutral: '🟡'}[data.sentiment] || '❓';
                content.querySelector('.vibe').innerHTML = `
                    <div class="label">Vibe Check</div>
                    <div class="value">${emoji} <strong>${(data.sentiment || '?').toUpperCase()}</strong></div>
                    <div class="value" style="margin-top:6px">${data.summary || ''}</div>
                `;
            })
            .catch(() => {
                content.querySelector('.vibe').innerHTML = '<div class="value" style="color:#ef4444">Vibe check unavailable</div>';
            });
    }

    function closeDetail() {
        document.getElementById('detail').classList.remove('open');
    }

    // --- Search ---
    function doSearch() {
        const q = document.getElementById('search-input').value.trim();
        if (!q) return;
        const container = document.getElementById('search-results');
        const treemap = document.getElementById('treemap');
        container.innerHTML = '<p style="color:#94a3b8">Searching...</p>';
        container.classList.add('open');
        treemap.style.display = 'none';

        fetch('/api/search?q=' + encodeURIComponent(q))
            .then(r => r.json())
            .then(data => {
                const markets = data.markets || [];
                if (!markets.length) {
                    container.innerHTML = '<span class="back" onclick="backToTreemap()">← Back</span><p>No results.</p>';
                    return;
                }
                let rows = markets.map(m => `
                    <tr style="cursor:pointer" onclick='showDetail(${JSON.stringify(m).replace(/'/g, "&#39;")})'>
                        <td>${m.slug}</td>
                        <td>${(m.question || '').substring(0, 60)}</td>
                        <td>${m.outcome_prices && m.outcome_prices[0] != null ? m.outcome_prices[0].toFixed(3) : '?'}</td>
                        <td>${fmtVol(m.volume_24h || 0)}</td>
                    </tr>
                `).join('');
                container.innerHTML = `
                    <span class="back" onclick="backToTreemap()">← Back to heatmap</span>
                    <table><tr><th>Slug</th><th>Question</th><th>Price</th><th>24h Vol</th></tr>${rows}</table>
                `;
            })
            .catch(() => {
                container.innerHTML = '<span class="back" onclick="backToTreemap()">← Back</span><p style="color:#ef4444">Search failed.</p>';
            });
    }

    document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

    function backToTreemap() {
        document.getElementById('search-results').classList.remove('open');
        document.getElementById('treemap').style.display = 'block';
    }

    // --- Fetch and refresh ---
    function refresh() {
        document.getElementById('status').textContent = 'Refreshing...';
        fetch('/api/markets')
            .then(r => r.json())
            .then(data => {
                marketsData = data.markets || [];
                const p = data.exponent;
                renderTreemap(marketsData);
                const scaleInfo = p === 1.0 ? 'raw' : `p=${p}`;
                document.getElementById('status').textContent = `${marketsData.length} markets (${scaleInfo}) · ${new Date().toLocaleTimeString()}`;
            })
            .catch(err => {
                document.getElementById('status').textContent = 'Error: ' + err.message;
            });
    }

    // --- Init ---
    refresh();
    refreshTimer = setInterval(refresh, 30000);
    window.addEventListener('resize', () => { if (marketsData.length) renderTreemap(marketsData); });
    </script>
</body>
</html>
