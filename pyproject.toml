[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polypulse"
version = "0.1.0"
description = "The smart terminal layer for Polymarket"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "textual>=0.40",
    "rich>=13.0",
    "requests>=2.31",
    "plyer>=2.1",
    "flask>=3.0",
]

[project.scripts]
polypulse = "polypulse.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
